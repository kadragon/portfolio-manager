repos:
  - repo: local
    hooks:
      - id: golangci-lint
        name: golangci-lint
        entry: golangci-lint run
        language: system
        types: [go]
        pass_filenames: false
        stages: [pre-commit]

      - id: go-test
        name: go test
        entry: go test ./...
        language: system
        types: [go]
        pass_filenames: false
        stages: [pre-commit]
        always_run: true

      - id: sqlc-diff
        name: sqlc diff
        entry: sqlc diff
        language: system
        pass_filenames: false
        stages: [pre-commit]
